<section id="Home__Banner" class="bg-third py-4 text-center">
  <div class="container">
    <div class="row justify-content-evenly g-4 g-lg-0 flex-nowrap overflow-x-auto">
      <div class="col-5 col-lg-2 flex-shrink-0 mb-3 mb-sm-0">
        <div class="row g-2 text-center align-items-center">
          <div class="col-4">
            <img src="./assets/images/banner_icons/website_views.png" alt="website views" loading="lazy"
              decoding="async" width="49" height="49" />
          </div>
          <div class="col-8 text-end">
            <p class="mb-0 fs-13 fw-bold">عدد زيارات الموقع</p>
            <p class="mb-0 fs-11 fw-bold">{{ websiteCounter }} زائر</p>
          </div>
        </div>
      </div>
      <div class="col-5 col-lg-2 flex-shrink-0 mb-3 mb-sm-0">
        <div class="row g-2 text-center align-items-center">
          <div class="col-4">
            <img src="./assets/images/banner_icons/weather.webp" loading="lazy" decoding="async" width="49" height="49"
              alt="weather" />
          </div>
          <div class="col-8 text-end">
            <p class="mb-0 fs-13 fw-bold">حالة الطقس بالرياض</p>
            <p [innerHTML]="currentTemp | safeHtml" class="mb-0 fs-11 fw-bold"></p>
          </div>
        </div>
      </div>
      <div class="col-5 col-lg-2 flex-shrink-0 mb-3 mb-sm-0">
        <div class="row g-2 text-center align-items-center">
          <div class="col-4">
            <img src="./assets/images/banner_icons/clock.svg" loading="lazy" decoding="async" width="49" height="49"
              alt="weather" />
          </div>
          <div class="col-8 text-end">
            <p class="mb-0 fs-13 fw-bold">التوقيت</p>
            <p class="mb-0 fs-11 fw-bold">
              {{ staticDate }}
            </p>
          </div>
        </div>
      </div>
      <div class="col-5 col-lg-2 flex-shrink-0 mb-3 mb-sm-0">
        <div class="row g-2 text-center align-items-center">
          <div class="col-4">
            <img src="./assets/images/banner_icons/people.svg" alt="التعداد السكاني" loading="lazy" decoding="async"
              width="49" height="49" />
          </div>
          <div class="col-8 text-end">
            <p class="mb-0 fs-13 fw-bold">التعداد السكاني {{ year }}</p>
            <p class="mb-0 fs-11 fw-bold">{{ currentPopulation }} مليون</p>
          </div>
        </div>
      </div>
      <div class="col-5 col-lg-2 flex-shrink-0 mb-3 mb-sm-0">
        <div class="row g-2 text-center align-items-center">
          <div class="col-4">
            <img src="./assets/images/banner_icons/money.svg" alt="1 USD vs SAR" loading="lazy" decoding="async"
              width="49" height="49" />
          </div>
          <div class="col-8 text-end">
            <p class="mb-0 fs-13 fw-bold">سعر الصرف</p>
            <p class="mb-0 fs-11 fw-bold ltr">1 USD = {{ sar }} SAR</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

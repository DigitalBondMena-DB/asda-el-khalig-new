<div
  class="lightBox position-fixed bg-white top-0 left-0 w-100 h-100 justify-content-center align-items-center"
  style="z-index: 9999999"
>
  <div
    class="lightBoxcontent d-flex flex-column justify-content-center align-items-center text-center"
  >
    <img
      src="./assets/images/new_logos/blue_text.png"
      role="presentation"
      style="width: 300px"
      class="d-block"
    />
    <div>
      <span class="loader"></span>
    </div>
  </div>
</div>
<div
  class="lightBox-details d-none position-fixed bg-white top-0 left-0 w-100 h-100 justify-content-center align-items-center"
  style="z-index: 9999999"
>
  <div
    class="lightBoxcontent d-flex flex-column justify-content-center align-items-center text-center"
  >
    <img
      src="./assets/images/new_logos/blue_text.png"
      role="presentation"
      style="width: 300px"
      class="d-block"
    />
    <div>
      <span class="loader"></span>
    </div>
  </div>
</div>
@if (isFoundingDay) {
  <div class="founding-day-circle">
    <img
      src="./assets/images/founding-day/founding-day-animate-logo.gif"
      alt="يوم التأسيس"
    />
  </div>
}
<p-toast position="bottom-right" [preventDuplicates]="true"></p-toast>
